name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Device model the test steps boot and run on; update if the runner image
  # drops it. Build steps don't reference it — they target the generic
  # simulator destination, which needs no concrete device (#40).
  SIMULATOR_NAME: iPhone 17

jobs:
  build-and-test:
    name: Build + test (unsigned simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Deliberately no Xcode selection: the jobs build with the image-default
      # Xcode, whose simulator devices are pre-provisioned. Selecting any other
      # Xcode restarts CoreSimulatorService against a device set provisioned by
      # a different version, and its first device queries can transiently
      # return zero devices (#40).
      - name: Show toolchain
        run: xcodebuild -version

      # Signing is deferred until the Apple developer account is provisioned, so
      # everything runs against a simulator with code signing disabled (CLAUDE.md).
      # Compile-checks all three targets (app, extension, framework) plus the
      # app-hosted unit-test bundle (IPAKeyboardTests, run below) and the
      # UI-test bundle; the UI tests themselves run in the separate ui-test job.
      # A signed device/archive lane stays out of scope until provisioning
      # lands (issue #3).
      #
      # build-for-testing needs only the SDK, not a device, so it targets
      # generic/platform=iOS Simulator: that skips simulator-device resolution
      # entirely, which can transiently see zero devices while
      # CoreSimulatorService is (re)starting and then fails the step (#40).
      - name: Build app + extension for testing
        run: |
          xcodebuild \
            -project IPAKeyboard.xcodeproj \
            -scheme IPAKeyboard \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing

      - name: Build IPAKeyboardKit for testing
        run: |
          xcodebuild \
            -project IPAKeyboard.xcodeproj \
            -scheme IPAKeyboardKit \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      # Running tests does need a concrete device: boot one by name, to
      # completion, and pass its UDID to the test step so both agree on the
      # device. No OS version spec — the deployment target (17.0) accepts any
      # runtime the image ships.
      - name: Boot simulator
        id: boot-simulator
        uses: ./.github/actions/boot-simulator
        with:
          simulator-name: ${{ env.SIMULATOR_NAME }}

      - name: Run IPAKeyboardKit unit tests
        run: |
          xcodebuild \
            -project IPAKeyboard.xcodeproj \
            -scheme IPAKeyboardKit \
            -destination "platform=iOS Simulator,id=${{ steps.boot-simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

      # App-hosted unit tests (IPAKeyboardTests) launch the unsigned app on the
      # booted simulator as the test host. Sequential for the same clone-race
      # reason as the UI tests (see the ui-test job); scoped so the UI-test
      # bundle in the same scheme stays in its own job.
      - name: Run IPAKeyboard app unit tests
        run: |
          xcodebuild \
            -project IPAKeyboard.xcodeproj \
            -scheme IPAKeyboard \
            -destination "platform=iOS Simulator,id=${{ steps.boot-simulator.outputs.udid }}" \
            -resultBundlePath AppTestResults.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:IPAKeyboardTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test-without-building

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            TestResults.xcresult
            AppTestResults.xcresult
          if-no-files-found: ignore

  # Runs the XCUITest bundle against the unsigned simulator build. Kept as a
  # separate job so the unit lane's fast feedback stays fast.
  ui-test:
    name: UI tests (unsigned simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Image-default Xcode on purpose — see the note in build-and-test (#40).
      - name: Show toolchain
        run: xcodebuild -version

      # Generic destination for the same reason as in build-and-test (#40).
      - name: Build app + extension for testing
        run: |
          xcodebuild \
            -project IPAKeyboard.xcodeproj \
            -scheme IPAKeyboard \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing

      # Launching the XCUITest runner on a still-booting simulator fails with
      # "Busy (Application failed preflight checks)", so boot the device to
      # completion and hand the test step its UDID (#40).
      - name: Boot simulator
        id: boot-simulator
        uses: ./.github/actions/boot-simulator
        with:
          simulator-name: ${{ env.SIMULATOR_NAME }}

      # Sequential (-parallel-testing-enabled NO): with clone-based parallel
      # testing, xcodebuild also launches the runner on the original device
      # and that launch races the boot, failing the run even when every test
      # passes on the clones.
      #
      # TEST_RUNNER_CI: xcodebuild strips the TEST_RUNNER_ prefix and forwards
      # CI=1 into the test-runner process, where testLaunchPerformance skips
      # itself (five measured launches whose numbers are noise on a shared
      # runner). GitHub's own CI=true job variable does not cross the
      # xcodebuild → runner boundary, hence the explicit prefix.
      - name: Run IPAKeyboardUITests
        env:
          TEST_RUNNER_CI: "1"
        run: |
          xcodebuild \
            -project IPAKeyboard.xcodeproj \
            -scheme IPAKeyboard \
            -destination "platform=iOS Simulator,id=${{ steps.boot-simulator.outputs.udid }}" \
            -resultBundlePath UITestResults.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:IPAKeyboardUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test-without-building

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          if-no-files-found: ignore
