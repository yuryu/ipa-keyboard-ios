name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Device model the test steps boot and run on; update if the runner image
  # drops it. Build steps don't reference it — they target the generic
  # simulator destination, which needs no concrete device (#40).
  SIMULATOR_NAME: iPhone 17

jobs:
  build-and-test:
    name: Build + test (simulator, ad-hoc signed)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Deliberately no Xcode selection: the jobs build with the image-default
      # Xcode, whose simulator devices are pre-provisioned. Selecting any other
      # Xcode restarts CoreSimulatorService against a device set provisioned by
      # a different version, and its first device queries can transiently
      # return zero devices (#40).
      - name: Show toolchain
        run: xcodebuild -version

      # The app scheme signs ad-hoc ("Sign to Run Locally"), which needs no
      # certificate, provisioning profile, or Apple account — only a simulator
      # destination. That is what embeds the App Group entitlement, so
      # `AppGroup.containerURL` is non-nil and the App-Group success paths
      # (forking, importing, the key-editor round trip) are actually exercised
      # here; the previous CODE_SIGNING_ALLOWED=NO lane left the container nil
      # and those tests skipped or took their degraded branch (issue #210).
      #
      # CODE_SIGN_STYLE=Manual overrides the project's Automatic style so
      # xcodebuild never tries to resolve the DEVELOPMENT_TEAM against an
      # account the runner does not have; CODE_SIGN_IDENTITY=- selects ad-hoc.
      # A signed *device*/archive lane still needs real provisioning and stays
      # out of scope (issue #3).
      #
      # Compile-checks all three targets (app, extension, framework) plus the
      # app-hosted unit-test bundle (IPAKeyboardTests, run below) and the
      # UI-test bundle; the UI tests themselves run in the separate ui-test job.
      #
      # build-for-testing needs only the SDK, not a device, so it targets
      # generic/platform=iOS Simulator: that skips simulator-device resolution
      # entirely, which can transiently see zero devices while
      # CoreSimulatorService is (re)starting and then fails the step (#40).
      - name: Build app + extension for testing
        run: |
          xcodebuild \
            -project IPAKeyboard.xcodeproj \
            -scheme IPAKeyboard \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            build-for-testing

      # The kit scheme stays unsigned on purpose: its test bundle has no
      # TEST_HOST, so there is no app to carry the App Group entitlement and
      # nothing for signing to buy. The kit tests cover the nil-container
      # behaviour through LayoutStore's injectable `containerURL` seam rather
      # than through the real container (issue #210).
      - name: Build IPAKeyboardKit for testing
        run: |
          xcodebuild \
            -project IPAKeyboard.xcodeproj \
            -scheme IPAKeyboardKit \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      # Running tests does need a concrete device: boot one by name, to
      # completion, and pass its UDID to the test step so both agree on the
      # device. No OS version spec — the deployment target (17.0) accepts any
      # runtime the image ships.
      - name: Boot simulator
        id: boot-simulator
        uses: ./.github/actions/boot-simulator
        with:
          simulator-name: ${{ env.SIMULATOR_NAME }}

      - name: Run IPAKeyboardKit unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project IPAKeyboard.xcodeproj \
            -scheme IPAKeyboardKit \
            -destination "platform=iOS Simulator,id=${{ steps.boot-simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building 2>&1 | tee kit-tests.log
          # Guard the Swift Testing zero-tests false-green (#188): xcodebuild
          # exits 0 with "Executed 0 tests … TEST SUCCEEDED" when a filter
          # matches nothing, so require the Swift Testing summary line
          # ("Test run with N tests …") to report a nonzero count.
          grep -Eq 'Test run with [1-9][0-9]* test' kit-tests.log

      # App-hosted unit tests (IPAKeyboardTests) launch the app on the booted
      # simulator as the test host. Sequential for the same clone-race reason
      # as the UI tests (see the ui-test job); scoped so the UI-test bundle in
      # the same scheme stays in its own job. These tests drive `LayoutStore`
      # through its injected `containerURL` seam, so they behave identically
      # signed or not — the signing flags here only have to match the
      # build-for-testing step above so test-without-building finds its
      # products.
      - name: Run IPAKeyboard app unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project IPAKeyboard.xcodeproj \
            -scheme IPAKeyboard \
            -destination "platform=iOS Simulator,id=${{ steps.boot-simulator.outputs.udid }}" \
            -resultBundlePath AppTestResults.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:IPAKeyboardTests \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            test-without-building 2>&1 | tee app-tests.log
          # Same zero-tests guard as the kit step (#188) — this -only-testing
          # filter is exactly the shape that silently matches nothing after a
          # target rename or test-plan drift.
          grep -Eq 'Test run with [1-9][0-9]* test' app-tests.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            TestResults.xcresult
            AppTestResults.xcresult
          if-no-files-found: ignore

  # Runs the XCUITest bundle against the ad-hoc-signed simulator build. Kept as
  # a separate job so the unit lane's fast feedback stays fast.
  ui-test:
    name: UI tests (simulator, ad-hoc signed)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Image-default Xcode on purpose — see the note in build-and-test (#40).
      - name: Show toolchain
        run: xcodebuild -version

      # Generic destination for the same reason as in build-and-test (#40);
      # ad-hoc signing for the App Group container — see the same note (#210).
      - name: Build app + extension for testing
        run: |
          xcodebuild \
            -project IPAKeyboard.xcodeproj \
            -scheme IPAKeyboard \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            build-for-testing

      # Launching the XCUITest runner on a still-booting simulator fails with
      # "Busy (Application failed preflight checks)", so boot the device to
      # completion and hand the test step its UDID (#40).
      - name: Boot simulator
        id: boot-simulator
        uses: ./.github/actions/boot-simulator
        with:
          simulator-name: ${{ env.SIMULATOR_NAME }}

      # Sequential (-parallel-testing-enabled NO): with clone-based parallel
      # testing, xcodebuild also launches the runner on the original device
      # and that launch races the boot, failing the run even when every test
      # passes on the clones.
      #
      # TEST_RUNNER_CI: xcodebuild strips the TEST_RUNNER_ prefix and forwards
      # CI=1 into the test-runner process, where testLaunchPerformance skips
      # itself (five measured launches whose numbers are noise on a shared
      # runner). GitHub's own CI=true job variable does not cross the
      # xcodebuild → runner boundary, hence the explicit prefix.
      #
      # No "did it actually run?" log guard here, unlike the unit steps: the
      # App-Group-dependent tests no longer tolerate a nil container, so a
      # signing regression fails them outright instead of skipping (#210).
      - name: Run IPAKeyboardUITests
        env:
          TEST_RUNNER_CI: "1"
        run: |
          xcodebuild \
            -project IPAKeyboard.xcodeproj \
            -scheme IPAKeyboard \
            -destination "platform=iOS Simulator,id=${{ steps.boot-simulator.outputs.udid }}" \
            -resultBundlePath UITestResults.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:IPAKeyboardUITests \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            test-without-building

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          if-no-files-found: ignore
